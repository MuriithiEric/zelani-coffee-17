openapi: 3.0.3
info:
  title: Zelani Coffee API
  version: 1.0.0
  description: Comprehensive REST API documentation for Zelani Coffee e-commerce platform
    covering authentication, user management, products catalog, cart operations, orders,
    payment processing, shipping tracking, and file uploads.
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: Returns API service name and seeds initial default products and
        admin user if database is empty.
      summary: API Root Welcome
      tags:
      - General
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: Authenticates user credentials and returns JWT access and refresh
        tokens.
      summary: User Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      description: Logs out the user on client side.
      summary: User Logout
      tags:
      - Auth
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: ''
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Generates a new pair of JWT access and refresh tokens for the authenticated
        user.
      summary: Refresh JWT Tokens
      tags:
      - Auth
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Registers a new customer account and returns JWT access and refresh
        tokens.
      summary: Register Customer
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/cart:
    get:
      operationId: cart_list
      description: Returns all items currently in the authenticated user shopping
        cart.
      summary: Get User Cart
      tags:
      - Cart
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItemDetail'
          description: ''
    post:
      operationId: cart_create
      description: Adds a product to the cart or updates quantity for the specific
        grind and size options.
      summary: Add or Update Cart Item
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCartRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCartRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemCreated'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    delete:
      operationId: cart_destroy
      description: Removes all items from the authenticated user shopping cart.
      summary: Clear Cart
      tags:
      - Cart
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: ''
  /api/cart/item:
    delete:
      operationId: cart_item_destroy
      description: Removes a specific product item (matching productId, grind, and
        size) from the cart.
      summary: Remove Cart Item
      parameters:
      - in: query
        name: grind
        schema:
          type: string
        description: Grind variation
      - in: query
        name: productId
        schema:
          type: string
        description: Product identifier to remove
        required: true
      - in: query
        name: size
        schema:
          type: string
        description: Package size variation
      tags:
      - Cart
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/files/{id}:
    get:
      operationId: files_retrieve
      description: Streams binary content of a private file if the requesting user
        owns it or has Admin role.
      summary: Download Private File
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: File record UUID
        required: true
      tags:
      - Files
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    delete:
      operationId: files_destroy
      description: Deletes a file from storage and removes its metadata record if
        the user owns it or has Admin role.
      summary: Delete File
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: File record UUID
        required: true
      tags:
      - Files
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/files/public/{id}:
    get:
      operationId: files_public_retrieve
      description: Streams binary content of a public file without requiring authentication.
      summary: Download Public File
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: File record UUID
        required: true
      tags:
      - Files
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/files/upload:
    post:
      operationId: files_upload_create
      description: Uploads an image, document, or PDF (up to 10MB) to secure local
        storage.
      summary: Upload File (Multipart)
      parameters:
      - in: query
        name: category
        schema:
          type: string
          default: general
        description: Storage subdirectory category
      - in: query
        name: isPublic
        schema:
          type: boolean
          default: false
        description: Whether file is publicly accessible without auth
      tags:
      - Files
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FileUploadRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      description: Verifies database connectivity and storage directory write permissions.
      summary: System Health Check
      tags:
      - General
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/orders:
    get:
      operationId: orders_list
      description: Retrieves all placed orders with items ordered by creation date
        descending. Requires Admin or Roaster role.
      summary: List All Orders (Admin / Roaster Only)
      tags:
      - Orders
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    post:
      operationId: orders_create
      description: Creates a customer order along with line items.
      summary: Place New Order
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/orders/{id}/status:
    patch:
      operationId: orders_status_partial_update
      description: Updates the payment/fulfillment status of an existing order. Requires
        Admin or Roaster role.
      summary: Update Order Status (Admin / Roaster Only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: Order UUID
        required: true
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusUpdateRequestRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/orders/my-orders:
    get:
      operationId: orders_my_orders_list
      description: Retrieves all orders placed by the currently authenticated user
        matching their email.
      summary: List Customer Orders
      tags:
      - Orders
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
          description: ''
  /api/orders/reference/{ref}:
    get:
      operationId: orders_reference_retrieve
      description: Fetches order details and items using the unique order reference
        code.
      summary: Get Order by Reference
      parameters:
      - in: path
        name: ref
        schema:
          type: string
        description: Order reference code (e.g. ORD-1724839201-ABCD)
        required: true
      tags:
      - Orders
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/payments:
    get:
      operationId: payments_list
      description: Retrieves all transaction logs and associated order metadata. Requires
        Admin role.
      summary: List Payment Logs (Admin Only)
      tags:
      - Payments
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentRecord'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    post:
      operationId: payments_create
      description: Stores a new payment transaction log record for an order.
      summary: Record Payment Log
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/payments/initiate:
    post:
      operationId: payments_initiate_create
      description: Initiates payment transaction (Card, M-Pesa, PayPal) and marks
        order payment status as completed.
      summary: Initiate Order Payment
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/products:
    get:
      operationId: products_list
      description: Returns the full catalog of coffee products.
      summary: List All Products
      tags:
      - Products
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: products_create
      description: Creates a new coffee product in the catalog. Requires Admin role.
      summary: Create Product (Admin Only)
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/products/{id}:
    put:
      operationId: products_update
      description: Updates product details. Requires Admin role.
      summary: Update Product (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
        description: Product slug / identifier
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    delete:
      operationId: products_destroy
      description: Deletes a product from the catalog. Requires Admin role.
      summary: Delete Product (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
        description: Product slug / identifier
        required: true
      tags:
      - Products
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/shipping/track:
    post:
      operationId: shipping_track_create
      description: Queries the DHL Express tracking API for real-time shipment status.
      summary: Track DHL Shipment
      tags:
      - Shipping
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingTrackRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShippingTrackRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShippingTrackRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/users:
    get:
      operationId: users_list
      description: Returns a list of all registered user accounts. Requires Admin
        privileges.
      summary: List Users (Admin Only)
      tags:
      - Users
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/users/{id}:
    patch:
      operationId: users_partial_update
      description: Updates fields (role, active status, name, password) of a specific
        user. Requires Admin role.
      summary: Update User Profile (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: User UUID
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    delete:
      operationId: users_destroy
      description: Deletes a specific user account. Requires Admin role.
      summary: Delete User Account (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: User UUID
        required: true
      tags:
      - Users
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/users/me:
    get:
      operationId: users_me_retrieve
      description: Returns profile information of the currently authenticated user.
      summary: Get Current User Profile
      tags:
      - Users
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
components:
  schemas:
    AddToCartRequestRequest:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
          description: Product identifier to add
        quantity:
          type: integer
          default: 1
          description: Quantity to add (defaults to 1)
        grind:
          type: string
          default: ''
          description: Chosen grind option
        size:
          type: string
          default: ''
          description: Chosen package size
      required:
      - productId
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
